name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build release binaries
        run: bin/cross-compile.sh "${GITHUB_REF_NAME}-${GITHUB_SHA}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/myke_darwin_amd64 bin/myke_linux_amd64 bin/myke_windows_amd64.exe --generate-notes
